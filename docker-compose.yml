
services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: doculens-postgres:16-pgvector
    container_name: doculens-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: doculens-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doculens-backend
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/doculens_test
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      DOCUMENT_STORAGE_DIR: ${DOCUMENT_STORAGE_DIR}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-1}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      EMBEDDING_STALE_SECONDS: ${EMBEDDING_STALE_SECONDS:-3600}
      FASTEMBED_CACHE_DIR: ${FASTEMBED_CACHE_DIR:-/app/storage/fastembed}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      LLM_PRIMARY_PROVIDER: ${LLM_PRIMARY_PROVIDER:-gemini}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-groq}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      RAG_TOP_K: ${RAG_TOP_K:-6}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.2}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-12000}
      CHAT_HISTORY_LIMIT: ${CHAT_HISTORY_LIMIT:-10}
      CHAT_MAX_QUESTION_LENGTH: ${CHAT_MAX_QUESTION_LENGTH:-4000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./storage/documents:/app/storage/documents
      - ./storage/fastembed:/app/storage/fastembed
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  postgres_data:
